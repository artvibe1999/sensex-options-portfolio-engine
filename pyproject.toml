[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensex-options-portfolio-engine"
version = "0.1.0"
description = "Paper-first, risk-controlled SENSEX options portfolio engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "structlog>=24.1,<26",
]

[project.optional-dependencies]
broker = ["kiteconnect>=5.0,<6"]
telegram = ["python-telegram-bot>=21,<23"]
db = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sensex_engine"]
